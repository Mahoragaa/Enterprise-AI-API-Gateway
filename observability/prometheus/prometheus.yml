global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # LiteLLM exposes Prometheus metrics at /metrics
  - job_name: litellm
    static_configs:
      - targets: ["litellm:4000"]
    metrics_path: /metrics

  # Mock providers — custom metrics from FastAPI (if added later)
  - job_name: mock-primary
    static_configs:
      - targets: ["mock-api-primary:8000"]
    metrics_path: /metrics

  - job_name: mock-fallback
    static_configs:
      - targets: ["mock-api-fallback:8000"]
    metrics_path: /metrics
