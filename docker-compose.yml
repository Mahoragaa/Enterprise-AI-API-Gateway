###############################################################################
# Enterprise AI API Gateway — Docker Compose
#
# Services:
#   1. mock-api-primary   – FastAPI fake LLM (port 9000)
#   2. mock-api-fallback  – FastAPI fake LLM (port 9001, independent state)
#   3. redis              – Shared state for rate limiting and health caching
#   4. db                 – PostgreSQL for LiteLLM teams, keys, and budgets (port 5432)
#   5. litellm            – LiteLLM proxy gateway (port 4000)
#   6. prometheus         – Metrics scraper (port 9090)
#   7. grafana            – Dashboard UI (port 3000)
#
# Usage:
#   cp .env.example .env        # configure your environment
#   docker compose up --build   # start everything
###############################################################################

services:
  # ── Mock LLM Provider (primary) ──────────────────────────────────────────
  mock-api-primary:
    build:
      context: ./mock_provider
      dockerfile: Dockerfile
    container_name: mock-api-primary
    restart: unless-stopped
    ports:
      - "9000:8000"
    environment:
      - INSTANCE_NAME=primary
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ── Mock LLM Provider (fallback) ─────────────────────────────────────────
  mock-api-fallback:
    build:
      context: ./mock_provider
      dockerfile: Dockerfile
    container_name: mock-api-fallback
    restart: unless-stopped
    ports:
      - "9001:8000"
    environment:
      - INSTANCE_NAME=fallback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ── Redis (distributed rate limiting & health state cache) ───────────────
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  # ── PostgreSQL (LiteLLM Virtual Keys, Teams, Budgets & Spend Storage) ────
  db:
    image: postgres:16-alpine
    container_name: gateway-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellmpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ── LiteLLM Proxy Gateway ───────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      # Master key for admin operations (key/team CRUD)
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-master-key-1234}
      # Redis connection (used for rate limiting, cooldown, health cache)
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Database connection (required for /team/new, /key/generate, spend tracking)
      - DATABASE_URL=${DATABASE_URL:-postgresql://litellm:litellmpassword@db:5432/litellm}
      # Admin UI Login Credentials (renders username & password login screen)
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD:-admin123}
      # Dummy OpenAI key — the mock providers don't validate it, but LiteLLM
      # requires the env var to be set since the model is prefixed "openai/"
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-fake-not-used}
      # Real Groq API Key for live AI responses
      - GROQ_API_KEY=${GROQ_API_KEY}
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--detailed_debug"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      mock-api-primary:
        condition: service_healthy
      mock-api-fallback:
        condition: service_healthy

  # ── Prometheus (metrics scraper) ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: gateway-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      - litellm

  # ── Grafana (dashboard UI) ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.2
    container_name: gateway-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-gateway123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/gateway_dashboard.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
